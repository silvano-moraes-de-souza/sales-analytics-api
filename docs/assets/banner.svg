<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Sales Analytics API: REST over the lakehouse gold layer with FastAPI and DuckDB: typed contract, keyset pagination, measured latency">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1016"/><stop offset="1" stop-color="#111a24"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0a370"/><stop offset="0.45" stop-color="#f5fbff"/>
      <stop offset="0.55" stop-color="#f5fbff"/><stop offset="1" stop-color="#e0a370"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e0a370" stop-opacity="0.30"/><stop offset="1" stop-color="#e0a370" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1b2430" stroke-width="1"/>
    </pattern>
    <style>
      .sans { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; } .mono { font-family: ui-monospace, 'Cascadia Code', Consolas, 'Liberation Mono', monospace; }
      .pulse { animation: pulse 3s ease-in-out infinite; transform-origin: 1040px 180px; }
      @keyframes pulse { 0%, 100% { transform: scale(0.92); opacity: .65; } 50% { transform: scale(1.08); opacity: 1; } }
      .fade { opacity: 0; animation: fade 8s infinite; }
      @keyframes fade { 0% { opacity: 0; transform: translateY(8px); } 6% { opacity: 1; transform: none; } 88% { opacity: 1; } 96%, 100% { opacity: 0; } }
      .grow { transform-box: fill-box; transform-origin: bottom; animation: grow 8s ease-out infinite; }
      @keyframes grow { 0% { transform: scaleY(0); } 18% { transform: scaleY(1); } 88% { transform: scaleY(1); opacity: 1; } 96%, 100% { transform: scaleY(1); opacity: 0; } }
      .growx { transform-box: fill-box; transform-origin: left; animation: growx 8s ease-out infinite; }
      @keyframes growx { 0% { transform: scaleX(0); } 18% { transform: scaleX(1); } 88% { transform: scaleX(1); opacity: 1; } 96%, 100% { transform: scaleX(1); opacity: 0; } }
      .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 8s ease-in-out infinite; }
      @keyframes draw { 0% { stroke-dashoffset: 1000; } 35% { stroke-dashoffset: 0; } 88% { stroke-dashoffset: 0; opacity: 1; } 96%, 100% { opacity: 0; } }
      .flow { stroke-dasharray: 6 8; animation: flow 1.4s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -28; } }
      .blink { animation: blink 1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0; } }
      .d1 { animation-delay: .3s; } .d2 { animation-delay: .6s; } .d3 { animation-delay: .9s; }
      .d4 { animation-delay: 1.2s; } .d5 { animation-delay: 1.5s; } .d6 { animation-delay: 1.8s; }
      .d7 { animation-delay: 2.1s; } .d8 { animation-delay: 2.4s; } .d9 { animation-delay: 2.7s; }
    </style>
  </defs>
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)" opacity="0.55"/>
  <circle class="pulse" cx="1040" cy="180" r="175" fill="url(#glow)"/>
  <rect x="64" y="64" width="6" height="232" rx="3" fill="#e0a370"/>
  <text x="96" y="96" class="mono" font-size="16" fill="#e0a370" letter-spacing="2">30 DAYS · DAY 06</text>
  <text x="92" y="152" class="sans" font-size="65" font-weight="800" fill="url(#shine)">Sales Analytics API</text>
  <text x="96" y="212" class="sans" font-size="20" fill="#9aa7b2">REST over the lakehouse gold layer with FastAPI and DuckDB:</text><text x="96" y="238" class="sans" font-size="20" fill="#9aa7b2">typed contract, keyset pagination, measured latency</text>
  <rect x="96" y="262" width="79" height="28" rx="14" fill="#161b22" stroke="#e0a370" stroke-opacity="0.45"/><text x="136" y="281" text-anchor="middle" class="mono" font-size="13" fill="#c9d1d9">FastAPI</text><rect x="185" y="262" width="71" height="28" rx="14" fill="#161b22" stroke="#e0a370" stroke-opacity="0.45"/><text x="221" y="281" text-anchor="middle" class="mono" font-size="13" fill="#c9d1d9">DuckDB</text><rect x="267" y="262" width="79" height="28" rx="14" fill="#161b22" stroke="#e0a370" stroke-opacity="0.45"/><text x="306" y="281" text-anchor="middle" class="mono" font-size="13" fill="#c9d1d9">Parquet</text>
  <g><rect x="850" y="44" width="380" height="272" rx="12" fill="#0d1117" stroke="#2a3542"/><rect x="866" y="60" width="44" height="22" rx="6" fill="#e0a370"/><text x="888" y="76" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#0b1016">GET</text><text x="920" y="76" class="mono" font-size="12" fill="#e6edf3">/v1/sales/summary?group_by=month</text><line x1="866" y1="94" x2="1214" y2="94" stroke="#2a3542"/><text x="870" y="116" class="mono fade d1" font-size="12" xml:space="preserve" fill="#8b949e">{</text><text x="870" y="135" class="mono fade d2" font-size="12" xml:space="preserve" fill="#c9d1d9">  &quot;group_by&quot;: &quot;month&quot;,</text><text x="870" y="154" class="mono fade d3" font-size="12" xml:space="preserve" fill="#c9d1d9">  &quot;rows&quot;: [</text><text x="870" y="173" class="mono fade d4" font-size="12" xml:space="preserve" fill="#c9d1d9">    {&quot;key&quot;: &quot;2025-06&quot;,</text><text x="870" y="192" class="mono fade d5" font-size="12" xml:space="preserve" fill="#c9d1d9">     &quot;orders&quot;: 43156,</text><text x="870" y="211" class="mono fade d6" font-size="12" xml:space="preserve" fill="#c9d1d9">     &quot;revenue_cents&quot;: 1352146201}</text><text x="870" y="230" class="mono fade d7" font-size="12" xml:space="preserve" fill="#8b949e">  ],</text><text x="870" y="249" class="mono fade d8" font-size="12" xml:space="preserve" fill="#c9d1d9">  &quot;total_revenue_cents&quot;: ...</text><text x="870" y="268" class="mono fade d9" font-size="12" xml:space="preserve" fill="#8b949e">}</text><g class="fade d5"><rect x="1010" y="284" width="46" height="22" rx="11" fill="#3fb950" fill-opacity=".15" stroke="#3fb950"/><text x="1033" y="299" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#3fb950">200</text></g><g class="fade d6"><rect x="1062" y="284" width="46" height="22" rx="11" fill="#e0a370" fill-opacity=".15" stroke="#e0a370"/><text x="1085" y="299" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#e0a370">304</text></g><g class="fade d7"><rect x="1114" y="284" width="46" height="22" rx="11" fill="#d29922" fill-opacity=".15" stroke="#d29922"/><text x="1137" y="299" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#d29922">400</text></g><g class="fade d8"><rect x="1166" y="284" width="46" height="22" rx="11" fill="#f85149" fill-opacity=".15" stroke="#f85149"/><text x="1189" y="299" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#f85149">404</text></g></g>
</svg>

[project]
name = "sales-analytics-api"
version = "0.1.0"
description = "REST over the lakehouse gold layer with FastAPI and DuckDB: typed contract, keyset pagination, measured latency"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Silvano Moraes de Souza" }]
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "fastapi>=0.115",
    "mini-lakehouse",
    "pytz>=2026.4",
    "shopflow-datagen",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "psutil>=6.0",
    "matplotlib>=3.9",
    "httpx>=0.27",
    "httpx2>=2.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sales_analytics_api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PL"]
ignore = ["PLR0913", "PLR0917", "PLR2004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --cov=sales_analytics_api --cov-report=term-missing"

[tool.uv.sources]
mini-lakehouse = { git = "https://github.com/silvano-moraes-de-souza/mini-lakehouse" }
shopflow-datagen = { git = "https://github.com/silvano-moraes-de-souza/shopflow-datagen" }

[project.scripts]
sales-api = "sales_analytics_api.cli:main"

[tool.ruff.lint.per-file-ignores]
# FastAPI declares query parameters with calls in argument defaults.
"src/sales_analytics_api/app.py" = ["B008"]
"bench/run.py" = ["E501"]

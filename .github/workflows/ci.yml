name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # setup-uv publishes full version tags only
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  compose-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up -d --build --wait --wait-timeout 300
      - name: Call the API
        run: |
          curl -fsS localhost:8000/health
          curl -fsS "localhost:8000/v1/sales/summary?start=2025-01-01&end=2025-12-31&group_by=month"
          curl -fsS "localhost:8000/v1/categories/top?month=2025-06&limit=3"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/v1/orders/999999999)" = 404
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
